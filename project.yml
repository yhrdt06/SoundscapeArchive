name: SoundscapeArchive
options:
  bundleIdPrefix: com.soundscape
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  minimumXcodeGenVersion: "2.38.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: SoundscapeArchive/Info.plist

targets:
  SoundscapeArchive:
    type: application
    platform: iOS
    sources:
      - path: SoundscapeArchive
        excludes:
          - "**/*.md"
    resources:
      - path: SoundscapeArchive/GoogleService-Info.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundscape.archive
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: SoundscapeArchive/Info.plist
      properties:
        CFBundleDisplayName: SoundscapeArchive
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "サウンドスケープを録音するためにマイクを使用します。"
        NSLocationWhenInUseUsageDescription: "録音した音声の位置情報を記録するために使用します。"
        UIBackgroundModes:
          - audio
          - location
    entitlements:
      path: SoundscapeArchive/SoundscapeArchive.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: firebase-ios-sdk
        products:
          - FirebaseAuth
          - FirebaseFirestore
          - FirebaseStorage

  SoundscapeArchiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoundscapeArchiveTests
    dependencies:
      - target: SoundscapeArchive

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "10.29.0"

schemes:
  SoundscapeArchive:
    build:
      targets:
        SoundscapeArchive: all
        SoundscapeArchiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoundscapeArchiveTests
    archive:
      config: Release
