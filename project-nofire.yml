name: SoundscapeArchive
options:
  bundleIdPrefix: com.soundscape
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  minimumXcodeGenVersion: "2.38.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: SoundscapeArchive/Info.plist

targets:
  SoundscapeArchive:
    type: application
    platform: iOS
    sources:
      - path: SoundscapeArchive
        excludes:
          - "**/*.md"
          - "Firebase/**"
          - "Auth/**"
          - "Sync/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundscape.archive
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG NO_FIREBASE"
    info:
      path: SoundscapeArchive/Info.plist
      properties:
        CFBundleDisplayName: SoundscapeArchive
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "サウンドスケープを録音するためにマイクを使用します。"
        NSLocationWhenInUseUsageDescription: "録音した音声の位置情報を記録するために使用します。"
        UIBackgroundModes:
          - audio
          - location

schemes:
  SoundscapeArchive:
    build:
      targets:
        SoundscapeArchive: all
    run:
      config: Debug
    archive:
      config: Release
