name: iOS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  XCODE_VERSION: "15.4"
  IOS_SIMULATOR: "iPhone 15"
  IOS_VERSION: "17.5"

jobs:
  build:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew tap homebrew/cask-versions 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          if [ -f "SoundscapeArchive.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' SoundscapeArchive.xcodeproj/project.pbxproj
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SoundscapeArchive.xcodeproj \
            -scheme SoundscapeArchive

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project SoundscapeArchive.xcodeproj \
            -scheme SoundscapeArchive \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Run Tests
        run: |
          xcodebuild test \
            -project SoundscapeArchive.xcodeproj \
            -scheme SoundscapeArchive \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-14
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          if [ -f "SoundscapeArchive.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' SoundscapeArchive.xcodeproj/project.pbxproj
          fi

      - name: Setup App Store Connect API Key
        env:
          API_KEY_DOUBLE_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          # Use a fixed filename to avoid masking issues with KEY_ID
          KEY_FILE="$HOME/private_keys/api_key.p8"
          # Double base64 decode (secret is double-encoded to avoid masking issues)
          printenv API_KEY_DOUBLE_B64 | base64 --decode | base64 --decode > "$KEY_FILE"
          echo "API key file created"
          ls -la "$HOME/private_keys/"

      - name: Build and Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project SoundscapeArchive.xcodeproj \
            -scheme SoundscapeArchive \
            -configuration Release \
            -archivePath "${{ runner.temp }}/SoundscapeArchive.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEV_TEAM" \
            CODE_SIGN_STYLE="Automatic" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/api_key.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$DEV_TEAM</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${{ runner.temp }}/SoundscapeArchive.xcarchive" \
            -exportPath "${{ runner.temp }}/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/api_key.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "${{ runner.temp }}/export/SoundscapeArchive.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
